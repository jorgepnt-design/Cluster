name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Keine kostenpflichtigen oder internen PDFs im Build
        run: |
          if find dist -name '*_1_Intern_Analyse.pdf' -o -name '*_3_Snapshot.pdf' | grep -q .; then
            echo "Kostenpflichtige oder interne PDFs gefunden" >&2
            exit 1
          fi
